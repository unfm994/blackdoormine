<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#000000">
<title>black_door_mine — design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    background:#000000;
    height:100%;
    overflow:hidden;
    color-scheme:dark only;
  }
  header, main{
    background:#000000;
  }
  body{
    opacity:0;
    transition:opacity 0.25s ease;
  }
  body.page-fade-in{
    opacity:1;
  }
  body.page-fade-out{
    opacity:0;
  }
  header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
    pointer-events:none;
  }
  header .logo-btn{
    display:inline-block;
    line-height:0;
    cursor:pointer;
    pointer-events:auto;
    -webkit-tap-highlight-color:transparent;
    transition:opacity 0.15s ease;
  }
  header .logo-btn:hover,
  header .logo-btn:active{
    opacity:0.6;
  }
  header img{
    width:220px;
    height:auto;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  main{
    position:fixed;
    inset:0;
  }
  #designCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .webgl-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New', Courier, monospace;
    font-size:9px;color:#8f8f89;letter-spacing:0.05em;
    text-align:center;padding:0 10vw;
  }
  #trackCaption{
    position:fixed;
    left:0;right:0;
    bottom:12%;
    z-index:5;
    text-align:center;
    font-family:'Courier New', Courier, monospace;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.3s ease;
  }
  #trackCaption.visible{
    opacity:1;
  }
  .caption-hit{
    display:inline-block;
    cursor:pointer;
    touch-action:manipulation;
    pointer-events:auto;
  }
  #trackCaption .track-title,
  #trackCaption .track-artist{
    transition:color 0.3s ease, opacity 0.3s ease;
  }
  #trackCaption.is-paused .track-title,
  #trackCaption.is-paused .track-artist{
    color:#6a6a67;
    animation:captionBreathe 2.6s ease-in-out infinite;
  }
  @keyframes captionBreathe{
    0%, 100%{opacity:0.55;}
    50%{opacity:1;}
  }
  #trackCaption .track-title{
    color:#f4f4f2;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:0.02em;
    margin-bottom:5px;
  }
  #trackCaption .track-artist{
    color:#f4f4f2;
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:10px;
    letter-spacing:0.1em;
  }
  @media (max-width:700px){
    header{padding:18px 0;}
    header img{width:170px;}
    #trackCaption .track-title{font-size:13px;}
    #trackCaption .track-artist{font-size:11px;}
  }
</style>
</head>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
  // fade in on arrival — pairs with the fade-out that happens on the previous page
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.body.classList.add('page-fade-in');
    });
  });

  function goToHome(){
    document.body.classList.add('page-fade-out');
    setTimeout(function(){
      window.location.href = '/';
    }, 250);
  }

  window.addEventListener('pageshow', function(event){
    if (event.persisted) {
      document.body.classList.remove('page-fade-out');
      document.body.classList.add('page-fade-in');
    }
  });

  (function initDesignCarousel(){
    const heroSection = document.querySelector('main');
    const canvas = document.getElementById('designCanvas');

    if (!window.THREE) {
      const fallback = document.createElement('div');
      fallback.className = 'webgl-fallback';
      fallback.textContent = "the 3d library didn't load — check your connection and refresh.";
      heroSection.appendChild(fallback);
      return;
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) {
      const fallback = document.createElement('div');
      fallback.className = 'webgl-fallback';
      fallback.textContent = "this browser can't render the carousel.";
      heroSection.appendChild(fallback);
      return;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(0, 0, 7);
    camera.lookAt(0, 0, 0);

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    function sizeToHero(){
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    sizeToHero();
    window.addEventListener('resize', sizeToHero);
    window.addEventListener('orientationchange', function(){
      setTimeout(sizeToHero, 100);
    });
    // brute-force self-correction: keep re-measuring for the first 2 seconds,
    // in case the very first read happened before the browser fully settled
    let resizeGuardTicks = 0;
    const resizeGuard = setInterval(function(){
      sizeToHero();
      resizeGuardTicks++;
      if (resizeGuardTicks > 20) clearInterval(resizeGuard);
    }, 100);

    // ---------- track data: slot 0 is real, the rest stay blank until you add more ----------

    const PREVIEW_LIMIT_SECONDS = 60;

    // ---------- build one item's artwork texture — plain white, or a real cover once loaded ----------
    function makeArtCanvas(coverImg){
      const c = document.createElement('canvas');
      c.width = 320; c.height = 320;
      const ctx = c.getContext('2d');
      if (coverImg) {
        ctx.drawImage(coverImg, 0, 0, c.width, c.height);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
      }
      return c;
    }

    // ---------- build the glossy reflection beneath a given artwork canvas ----------
    function makeReflectionCanvas(sourceCanvas, reflectionHeightRatio){
      const rc = document.createElement('canvas');
      rc.width = sourceCanvas.width;
      rc.height = Math.round(sourceCanvas.height * reflectionHeightRatio);
      const ctx = rc.getContext('2d');
      // draw the source flipped vertically, cropped to the top slice (closest to the mirror line) — fully opaque
      ctx.save();
      ctx.scale(1, -1);
      ctx.drawImage(sourceCanvas, 0, -rc.height);
      ctx.restore();
      // darken it top-to-bottom via multiply blend — this changes color, not alpha, so it stays fully solid
      ctx.globalCompositeOperation = 'multiply';
      const grad = ctx.createLinearGradient(0, 0, 0, rc.height);
      grad.addColorStop(0, 'rgba(120,120,120,1)'); // already dimmed right at the seam, not identical to the source
      grad.addColorStop(1, 'rgba(0,0,0,1)'); // fully black by the bottom
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rc.width, rc.height);
      return rc;
    }

      const idx = 'design_' + String(i + 1).padStart(3, '0');
      const track = TRACKS[i] || null;
      const group = new THREE.Group();

      const dimCanvas = makeArtCanvas(null);
      const brightCanvas = makeArtCanvas(null);

      const dimGeo = new THREE.PlaneGeometry(ITEM_SIZE, ITEM_SIZE);
      const dimMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(dimCanvas), transparent: true, side: THREE.DoubleSide, depthWrite: true, depthTest: true });
      const dimMesh = new THREE.Mesh(dimGeo, dimMat);
      group.add(dimMesh);

      // bright layer sits exactly on top, faded in smoothly on hover/active — a real crossfade, not a swap
      const brightGeo = new THREE.PlaneGeometry(ITEM_SIZE, ITEM_SIZE);
      const brightMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(brightCanvas), transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
      const brightMesh = new THREE.Mesh(brightGeo, brightMat);
      brightMesh.position.z = 0.001;
      group.add(brightMesh);

      const reflCanvas = makeReflectionCanvas(dimCanvas, REFLECTION_RATIO);
      const reflTex = new THREE.CanvasTexture(reflCanvas);
      const reflHeight = ITEM_SIZE * REFLECTION_RATIO;
      const reflGeo = new THREE.PlaneGeometry(ITEM_SIZE, reflHeight);
      const reflMat = new THREE.MeshBasicMaterial({ map: reflTex, transparent: false, side: THREE.DoubleSide, depthWrite: true, depthTest: true });
      const reflMesh = new THREE.Mesh(reflGeo, reflMat);
      reflMesh.position.set(0, -(ITEM_SIZE / 2) - (reflHeight / 2), 0);
      group.add(reflMesh);

      scene.add(group);
      const item = { group, dimMesh, brightMesh, reflMesh, dimMat, brightMat, reflMat, idx, i, hoverAmount: 0, track, audioEl: null };
      items.push(item);

      // if this slot has a real track, load its cover art async and swap textures in once ready
      if (track) {
        const coverImg = new Image();
        coverImg.onload = function(){
          const newDim = makeArtCanvas(coverImg);
          const newBright = makeArtCanvas(coverImg);
          item.dimMat.map = new THREE.CanvasTexture(newDim);
          item.dimMat.map.needsUpdate = true;
          item.brightMat.map = new THREE.CanvasTexture(newBright);
          item.brightMat.map.needsUpdate = true;
          const newRefl = makeReflectionCanvas(newDim, REFLECTION_RATIO);
          item.reflMat.map = new THREE.CanvasTexture(newRefl);
          item.reflMat.map.needsUpdate = true;
        };
        coverImg.src = track.cover;

        const audioEl = document.createElement('audio');
        audioEl.src = track.audio;
        audioEl.preload = 'none';
        audioEl.loop = false;
        audioEl.addEventListener('timeupdate', function(){
          if (audioEl.currentTime >= PREVIEW_LIMIT_SECONDS) {
            audioEl.pause();
            audioEl.currentTime = 0;
          }
        });
        item.audioEl = audioEl;
      }
    }

    // ---------- prize-wheel momentum physics ----------
    // offset is unbounded (never clamped) — only the per-item wrapped distance loops back around 1-10
    let offset = 0;
    let velocity = 0;          // offset-units per second, decays via friction
    let settleTarget = null;   // once velocity dies down, ease smoothly onto the nearest slot
    let dragging = false;
    const FRICTION = 3.4;       // higher = slows down faster, less coasting
    const MAX_VELOCITY = 9;
    const SETTLE_THRESHOLD = 0.06;

    // shortest path to a given slot, going whichever way around the loop is closer
    function shortestTargetFor(itemIndex, fromOffset){
      const raw = itemIndex - fromOffset;
      const wrapped = raw - count * Math.round(raw / count);
      return fromOffset + wrapped;
    }

    // ---------- desktop: wheel adds spin, harder/faster scrolling = more momentum ----------
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      settleTarget = null;
      velocity += e.deltaY * 0.0055;
      velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity));
    }, { passive: false });

    // ---------- mobile: drag follows the finger directly, release hands off momentum ----------
    let dragLastX = null;
    let dragLastTime = null;
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      dragging = true;
      settleTarget = null;
      velocity = 0;
      dragLastX = t.clientX;
      dragLastTime = performance.now();
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      if (!t) return;
      const now = performance.now();
      const dtMs = Math.max(1, now - dragLastTime);
      const deltaPx = t.clientX - dragLastX;
      const rect = canvas.getBoundingClientRect();
      const deltaOffset = -(deltaPx / rect.width) * (count * 0.9);
      offset += deltaOffset;
      velocity = (deltaOffset / dtMs) * 1000 * 0.6; // instantaneous speed, carried forward as spin on release
      dragLastX = t.clientX;
      dragLastTime = now;
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      dragging = false;
      velocity = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocity));
    });

    // ---------- raycasting shared by hover + click ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function pointerToNDC(clientX, clientY){
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    }
    function raycastItem(){
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(items.map(it => it.dimMesh));
      if (hits.length) return items.find(it => it.dimMesh === hits[0].object);
      return null;
    }

    // ---------- real mouse hover: fades the bright layer in smoothly ----------
    let hoveredItem = null;
    canvas.addEventListener('mousemove', (e) => {
      pointerToNDC(e.clientX, e.clientY);
      hoveredItem = raycastItem();
    });
    canvas.addEventListener('mouseleave', () => { hoveredItem = null; });

    // ---------- tap/click a visible item to select it — eases the short way around the loop ----------
    canvas.addEventListener('click', (e) => {
      pointerToNDC(e.clientX, e.clientY);
      const hit = raycastItem();
      if (hit) {
        velocity = 0;
        settleTarget = shortestTargetFor(hit.i, offset);
      }
    });

    let lastTime = performance.now();

    // ---------- preview playback: dwell 1s on a track before it plays, only one plays at a time ----------
    const captionEl = document.getElementById('trackCaption');
    const captionTitleEl = captionEl.querySelector('.track-title');
    const captionArtistEl = captionEl.querySelector('.track-artist');
    let dwellTarget = null;
    let dwellSince = 0;
    let playingItem = null;

    // caption color reflects the TRUTH of playback, not an assumption —
    // starts paused-looking, only turns "active" once audio genuinely starts
    items.forEach(function(item){
      if (!item.audioEl) return;
      item.audioEl.addEventListener('playing', function(){
        if (playingItem === item) captionEl.classList.remove('is-paused');
      });
      item.audioEl.addEventListener('pause', function(){
        if (playingItem === item) captionEl.classList.add('is-paused');
      });
    });

    // tapping the caption itself is the play/pause control — exposed as a real
    // global function since inline onclick (the pattern already proven reliable
    // on iOS everywhere else on this site) runs in global scope, not this closure
    window.toggleCaptionPlayback = function(){
      if (!playingItem || !playingItem.audioEl) return;
      if (playingItem.audioEl.paused) {
        playingItem.audioEl.play().catch(() => {});
      } else {
        playingItem.audioEl.pause();
      }
    };

    function fadeOutAndStop(item){
      if (!item || !item.audioEl) return;
      const audioEl = item.audioEl;
      const fadeDuration = 350;
      const startVolume = audioEl.volume;
      const startTime = performance.now();
      function step(now){
        const t = Math.min(1, (now - startTime) / fadeDuration);
        audioEl.volume = startVolume * (1 - t);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          audioEl.pause();
          audioEl.currentTime = 0;
          audioEl.volume = 1; // reset so it's back to full volume next time it plays
        }
      }
      requestAnimationFrame(step);
    }

    function stopPlaying(){
      fadeOutAndStop(playingItem);
      playingItem = null;
      captionEl.classList.remove('visible');
      captionEl.classList.remove('is-paused');
    }

    function startPlaying(item){
      stopPlaying();
      if (!item.track || !item.audioEl) return;
      item.audioEl.currentTime = 0;
      captionEl.classList.add('is-paused'); // honest default — flips to active only once 'playing' actually fires
      item.audioEl.play().catch(() => {
        // blocked until a real click/tap happens somewhere on the page — the caption tap handles that now
      });
      playingItem = item;
      captionTitleEl.textContent = item.track.title;
      captionArtistEl.textContent = item.track.artist;
      captionEl.classList.add('visible');
    }

    function animate(now){
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (dragging) {
        // offset already being driven directly by touchmove — nothing to do here
      } else if (settleTarget !== null) {
        offset += (settleTarget - offset) * 0.26;
        if (Math.abs(settleTarget - offset) < 0.001) {
          offset = settleTarget;
          settleTarget = null;
        }
      } else if (Math.abs(velocity) > 0.001) {
        offset += velocity * dt;
        velocity *= Math.exp(-FRICTION * dt);
        if (Math.abs(velocity) < SETTLE_THRESHOLD) {
          velocity = 0;
          settleTarget = Math.round(offset);
        }
      }

      // wrapped nearest slot, for the "which one is centered right now" checks
      const centeredIndex = ((Math.round(offset) % count) + count) % count;

      // hover always counts immediately, but the "centered" item only counts once we're
      // genuinely at rest — otherwise this flickers mid-transition and the dwell timer
      // never gets a clean second to count up
      const isSettled = !dragging && velocity === 0 && settleTarget === null;
      const focusTarget = hoveredItem || (isSettled ? items[centeredIndex] : null);

      if (focusTarget !== dwellTarget) {
        dwellTarget = focusTarget;
        dwellSince = now;
      } else if (dwellTarget && dwellTarget.track && playingItem !== dwellTarget && (now - dwellSince) >= FOCUS_DWELL_MS) {
        startPlaying(dwellTarget);
      }
      if (!focusTarget || !focusTarget.track) {
        if (playingItem) stopPlaying();
      } else if (playingItem && playingItem !== focusTarget) {
        stopPlaying();
      }

      items.forEach(item => {
        // shortest wrapped distance — makes the row loop seamlessly instead of jumping
        let d = item.i - offset;
        d = d - count * Math.round(d / count);
        const absD = Math.abs(d);

        const rampT = Math.min(absD, 1); // ramps 0 to 1 as it leaves center, then holds — so the extra gap doesn't create a jump
        const x = d * baseSpacing + Math.sign(d) * centerExtraGap * rampT;
        const clampedD = Math.max(-1, Math.min(1, d));
        const rotY = -clampedD * (Math.PI * 0.4); // curled hard — 72deg, well clear of the flat center tile even at tight milkcrate spacing
        const z = -Math.min(absD, 7) * depthStep;
        const scale = 1 + Math.min(absD, 1) * 0.45; // tilted tiles get a bit bigger to counteract how much thinner steep perspective makes them look

        item.group.position.set(x, ITEM_SIZE * 0.12, z);
        item.group.rotation.y = rotY;
        item.group.scale.setScalar(scale);
        item.group.visible = absD < 4.5; // only ever the closest wrapped copy needs to be visible now

        // smooth fade toward bright when this is the shared focus target
        const isFocused = item === focusTarget;
        const target = isFocused ? 1 : 0;
        item.hoverAmount += (target - item.hoverAmount) * 0.18;
        item.brightMesh.material.opacity = item.hoverAmount;
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  })();
</script>

</body>
</html>
