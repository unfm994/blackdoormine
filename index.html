<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#000000;
    height:100%;
    overflow:hidden;
  }
  header, main{
    background:#000000;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
  }
  header .logo-btn{
    display:inline-block;
    line-height:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:opacity 0.15s ease;
  }
  header .logo-btn:hover,
  header .logo-btn:active{
    opacity:0.6;
  }
  header img{
    width:220px;
    height:auto;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-touch-callout:none;
    opacity:0;
    transform:scale(0.98);
    animation:logoEntrance 1.1s cubic-bezier(.16,1,.3,1) 0.5s forwards;
  }
  @keyframes logoEntrance{
    to{opacity:1;transform:scale(1);}
  }
  main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    padding:0 24px 24px;
  }
  main img{
    max-width:208px;
    max-height:50vh;
    width:auto;
    height:auto;
    display:block;
    object-fit:contain;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .photo-frame{
    position:relative;
    display:inline-block;
    line-height:0;
  }
  .photo-overlay{
    position:absolute;
    inset:0;
    background:#000000;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .photo-overlay.intro{
    animation:introPulse 2s ease 2.5s 1 forwards;
  }
  @keyframes introPulse{
    0%{opacity:0;}
    10%{opacity:0.4;}
    85%{opacity:0.4;}
    100%{opacity:0;}
  }
  .photo-frame:hover .photo-overlay,
  .photo-frame:active .photo-overlay{
    opacity:0.4;
  }
  .cat-btn{
    position:absolute;
    display:block;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .cat-btn img{
    display:block;
    height:11px;
    width:auto;
    -webkit-user-drag:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .cat-tl{top:7%;left:6%;}
  .cat-tr{top:7%;right:6%;}
  .cat-bl{bottom:7%;left:6%;}
  .cat-br{bottom:7%;right:6%;}
  @media (max-width:700px){
    header{padding:18px 0;}
    header img{width:170px;}
    main{padding:0 16px 16px;}
    main img{max-width:50vw;}
    .cat-btn img{height:10px;}
  }
</style>
